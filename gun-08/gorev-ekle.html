<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Ekle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
  <a href="index.html">Tanıtım</a>
  <a href="gorevler.html">Görevler</a>
  <a href="gorev-ekle.html">Görev Ekle</a>
</nav>
    <h1>Görev Ekle</h1><hr>
    <p>Bu form bir HTML alıştırmasıdır; görev kaydetmez.</p>
    <form action="gorev-ekle.html" method="get" class="gorev-form">
        <label for="gorev-basligi">Görev Başlığı: <input id="gorev-basligi" tabindex="2" required type="text" minlength="3" maxlength="80" aria-describedby="baslik-detay"></label>
        <br><small id="baslik-detay">3-80 karakter kullan. Görevi kısa ve anlaşılır biçimde adlandır.</small><br><br>
        <label for="aciklama">Açıklama: <textarea id="aciklama" tabindex="4" maxlength="300" aria-describedby="aciklama-detay"></textarea>
        <br><small id="aciklama-detay">İsteğe bağlıdır. En fazla 300 karakter yazabilirsin.</small><br><br>
        <label for="oncelik">Öncelik: <select id="oncelik" tabindex="1" required><option value="">Öncelik Seçiniz</option><option value="düsük">Düşük</option><option value="orta">Orta</option><option value="yuksek">Yüksek</option></select><br><br>
        <label for="tarih">Hedef Tarih: <input id="tarih" tabindex="3" type="date" aria-describedby="tarih-detay"></label>
        <br><small id="tarih-detay">İsteğe bağlıdır. Görevi tamamlamayı planladığın tarihi seç.</small><br><br>
        <label for="kategori">Kategori: <select id="kategori"><option value="">Kategori Seçiniz</option><option value="ogrenme">Öğrenme</option><option value="uygulama">Uygulama</option><option value="toplantı">Toplantı</option></select></label>
        <button tabindex="-1" type="submit">Formu Kontrol Et</button>
        <button type="reset">Formu Sıfırla</button>
    </form>
</body>
</html>
