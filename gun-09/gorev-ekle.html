<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Ekle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
  <a href="index.html">Tanıtım</a>
  <a href="gorevler.html">Görevler</a>
  <a href="gorev-ekle.html">Görev Ekle</a>
</nav>
    <h1>Görev Ekle</h1><hr>
    <p>Bu form bir HTML alıştırmasıdır; görev kaydetmez.</p>
    <form action="gorev-ekle.html" method="get" class="gorev-form">
        <div class="alan">
        <label for="gorev-basligi">Görev Başlığı: <input id="gorev-basligi" required type="text" minlength="3" maxlength="80" aria-describedby="baslik-yardim baslik-hata"></label>
            <small id="baslik-yardim">3-80 karakter kullan. Görevi kısa ve anlaşılır biçimde adlandır.</small>
            <small id="baslik-hata" class="hata-mesaji">Hata: Başlık en az 3 karakter olmalı.</small>
        </div>
        <label for="aciklama">Açıklama: <textarea id="aciklama" maxlength="300" aria-describedby="aciklama-detay"></textarea>
        <small id="aciklama-yardim">İsteğe bağlıdır. En fazla 300 karakter yazabilirsin.</small></p>
        <div class="alan"><label for="oncelik">Öncelik: <select id="oncelik" required aria-describedby="oncelik-hata"><option value="">Öncelik Seçiniz</option><option value="düsük">Düşük</option><option value="orta">Orta</option><option value="yuksek">Yüksek</option></select>
        <small id="oncelik-hata" class="hata-mesaji">Hata: Öcelik seçmek zorunludur.</small>
        </div>
        <label for="tarih">Hedef Tarih: <input id="tarih" type="date" aria-describedby="tarih-detay"></label>
        <small id="tarih-yardim">İsteğe bağlıdır. Görevi tamamlamayı planladığın tarihi seç.</small><br><br>
        <label for="kategori">Kategori: <select id="kategori"><option value="">Kategori Seçiniz</option><option value="ogrenme">Öğrenme</option><option value="uygulama">Uygulama</option><option value="toplantı">Toplantı</option></select></label>
        <div class="form-butonlar">
        <button type="submit" class="btn btn-birincil">Görevi Kaydet</button>
        <button type="reset" class="btn btn-ikincil">Temizle</button></div>
    </form>
</body>
</html>
