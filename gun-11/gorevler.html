<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Görevlerim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
  <a href="index.html">Tanıtım</a>
  <a href="gorevler.html">Görevler</a>
  <a href="gorev-ekle.html">Görev Ekle</a>
</nav>

<h1>Görevlerim</h1>
  <hr>
  <ul id="gorevListesi"></ul>
  <a href="gorev-ekle.html">+ Yeni görev ekle</a>

  <script>
    const gorevler = [
      { baslik: "Müşteriye teklif gönder", oncelik: "yüksek", kategori: "uygulama", tamamlandi: false },
      { baslik: "JavaScript döngülerini çalış", oncelik: "orta", kategori: "ogrenme", tamamlandi: true },
      { baslik: "Toplantı notlarını düzenle", oncelik: "düşük", kategori: "uygulama", tamamlandi: false }
    ];

    const liste = document.getElementById("gorevListesi");

    for (const gorev of gorevler) {
      const satir = document.createElement("li");

      if (gorev.tamamlandi) {
        satir.textContent = "✅ " + gorev.baslik + " (" + gorev.oncelik + ")";
      } else {
        satir.textContent = "⬜ " + gorev.baslik + " (" + gorev.oncelik + ")";
      }

      liste.appendChild(satir);
    }
  </script>
</body>
</html>
